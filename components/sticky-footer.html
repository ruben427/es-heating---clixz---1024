<!-- ══════════════════════════════════════
     Sticky Footer Component
     components/sticky-footer.html
     ══════════════════════════════════════

     Usage:
       Copy the .sticky-footer block into any page that needs it.
       Add padding-bottom to the page body so content isn't hidden
       behind the sticky footer (e.g. padding-bottom: 100px).

       Links:  Replace href="#" with real target URLs.
       Labels: Replace button text as needed.
  ══════════════════════════════════════ -->

<div class="sticky-footer">
  <div class="sticky-footer__tile">
    <a class="sticky-footer__btn-primary" href="#">Offerte ondertekenen</a>
    <a class="sticky-footer__btn-secondary" href="#">Afwijzen</a>
  </div>
</div>
