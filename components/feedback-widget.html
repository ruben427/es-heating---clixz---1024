<!--
  FeedbackWidget — Reusable review/rating badge component
  =========================================================
  Usage: include this snippet wherever you need the review badge.

  Customise via data attributes OR CSS custom properties:
    data-score="8.3"        — The numeric rating shown large
    data-count="5277"       — Number of reviews
    data-label="beoordelingen" — Label below the count

  CSS custom properties (override in parent scope):
    --fw-score-size   : font-size of the score  (default 42px)
    --fw-meta-size    : font-size of count/label (default 18px)
    --fw-text-color   : text colour              (default #262626)
-->
<div class="fw-widget">
  <img
    class="fw-logo"
    src="https://c.animaapp.com/n495pQ6l/img/logo-@2x.png"
    alt="Atom logo"
  />
  <div class="fw-stars">
    <img
      class="fw-stars-img"
      src="https://c.animaapp.com/n495pQ6l/img/group@2x.png"
      alt="star rating"
    />
  </div>
  <div class="fw-body">
    <div class="fw-score">8.3</div>
    <div class="fw-meta">
      <div class="fw-count">5277</div>
      <div class="fw-label">beoordelingen</div>
    </div>
  </div>
</div>
